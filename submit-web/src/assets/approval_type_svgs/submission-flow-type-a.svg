<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'BC Sans', 'Noto Sans', Verdana, Arial, sans-serif" role="img" aria-labelledby="ta-title ta-desc">
  <title id="ta-title">Type A submission flow: Additional Information</title>
  <desc id="ta-desc">Two-actor flow. Regulated Party creates a package and submits it. EAO receives it (New Submission), verifies each document internally (Internal Verification, then Verified). The package is terminal at Verified for Type A. Acknowledgement is optional.</desc>

  <style>
    .ttl     { fill: #013366; font-size: 18px; font-weight: 700; }
    .sub     { fill: #606060; font-size: 12px; }
    .lane    { fill: #909090; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .badge   { font-size: 13px; font-weight: 400; fill: #2d2d2d; }
    .item    { font-size: 13px; font-weight: 400; fill: #2d2d2d; }
    .verify  { font-size: 12px; font-weight: 500; fill: #013366; }
    .helper  { font-size: 11px; fill: #606060; }
    .cap     { fill: #1F5F2A; font-size: 13px; font-weight: 600; }
    .leg     { fill: #2d2d2d; font-size: 12px; }
    .legk    { fill: #013366; font-size: 12px; font-weight: 700; }
    .opt     { fill: #888; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  </style>

  <rect x="0" y="0" width="880" height="4" fill="#FCBA19"/>

  <text x="24" y="36" class="ttl">Type A: Additional Information submission</text>
  <text x="24" y="56" class="sub">Verification only. Acknowledgement is optional.</text>

  <!-- ============================================
       FLOW STRIP
       Step widths vary: narrow 130, wide 170 (where item row sits beneath).
       Layout: 130, 130, 170, 130, 130 = 690 + 4 arrows (22) = 778. Pad 24/each side = 826. Use 880 for breathing room.
       Step starts: 24, 176, 328, 520, 672
       Centers (mid-Y): 180
       ============================================ -->

  <!-- Lane bands -->
  <rect x="14" y="80" width="148" height="170" rx="10" fill="#FFFAEC" stroke="#FCE9B6"/>
  <text x="24" y="98" class="lane">Regulated Party</text>

  <rect x="170" y="80" width="688" height="170" rx="10" fill="#F4F8FC" stroke="#D6E2EF"/>
  <text x="180" y="98" class="lane">EAO</text>

  <!-- ===== STEP 1 (RP): Created (130) ===== -->
  <g transform="translate(24, 110)">
    <text x="0" y="0" class="helper">Creates package</text>
    <rect x="0" y="14" width="130" height="24" rx="4" fill="#FFF4D6" stroke="#FCBA19"/>
    <text x="65" y="31" text-anchor="middle" class="badge">Created</text>
    <text x="0" y="64" class="helper">Submits to EAO</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M156 168 L174 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== STEP 2 (EAO): New Submission (130) ===== -->
  <g transform="translate(176, 110)">
    <text x="0" y="0" class="helper">EAO receives</text>
    <rect x="0" y="14" width="130" height="24" rx="4" fill="#F3E8FF" stroke="#D8B4FE"/>
    <text x="65" y="31" text-anchor="middle" class="badge">New Submission</text>
    <text x="0" y="64" class="helper">Package opened</text>
  </g>

  <path d="M308 168 L326 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== STEP 3 (EAO): Internal Verification (170) + item row ===== -->
  <g transform="translate(328, 110)">
    <text x="0" y="0" class="helper">Each document reviewed</text>
    <rect x="0" y="14" width="170" height="24" rx="4" fill="#FEF1D8" stroke="#F8BB47"/>
    <text x="85" y="31" text-anchor="middle" class="badge">Internal Verification</text>
    <!-- Item row: Verify (outline button) -> Verified -->
    <g transform="translate(0, 56)">
      <!-- Verify outline button -->
      <rect x="0" y="0" width="60" height="24" rx="4" fill="#fff" stroke="#013366"/>
      <text x="30" y="17" text-anchor="middle" class="verify">Verify</text>
      <!-- arrow -->
      <path d="M66 12 L78 12" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrowSm)"/>
      <!-- Verified item badge -->
      <rect x="82" y="0" width="86" height="24" rx="4" fill="#F6FFF8" stroke="#42814A"/>
      <path d="M89 12 l4 4 l8 -8" stroke="#2e8540" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="125" y="17" text-anchor="middle" class="item">Verified</text>
    </g>
  </g>

  <path d="M500 168 L518 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== STEP 4 (EAO): Verified (TERMINAL) (130) ===== -->
  <g transform="translate(520, 110)">
    <text x="0" y="0" class="helper">All items verified</text>
    <rect x="0" y="14" width="130" height="24" rx="4" fill="#F6FFF8" stroke="#42814A" stroke-width="2"/>
    <text x="65" y="31" text-anchor="middle" class="badge">Verified</text>
    <text x="65" y="64" text-anchor="middle" class="cap">Terminal for Type A</text>
  </g>

  <!-- Optional arrow (dashed) -->
  <path d="M652 168 L668 168" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="660" y="158" text-anchor="middle" class="opt">Optional</text>

  <!-- ===== STEP 5 (EAO): Acknowledged (optional) (130) ===== -->
  <g transform="translate(672, 110)">
    <text x="0" y="0" class="helper">EAO triggers acknowledgement</text>
    <rect x="0" y="14" width="130" height="24" rx="4" fill="#F6FFF8" stroke="#42814A" stroke-dasharray="4 3"/>
    <text x="65" y="31" text-anchor="middle" class="badge">Acknowledged</text>
    <text x="0" y="60" class="helper">Automated email sent</text>
    <text x="0" y="74" class="helper">to Regulated Party.</text>
  </g>

  <!-- ============================================
       LEGEND
       ============================================ -->
  <line x1="24" y1="290" x2="856" y2="290" stroke="#E0E0E0"/>

  <text x="24" y="316" class="legk">Verification</text>
  <text x="24" y="334" class="leg">Quick internal check that each document is receivable: correct file, not password protected, matches what was expected.</text>
  <text x="24" y="350" class="leg">This step is internal to EAO and is not visible to the Regulated Party.</text>

  <text x="24" y="378" class="legk">Acknowledgement</text>
  <text x="24" y="396" class="leg">Deeper review confirming each document delivers the substantive content required for the submission. Once the package is</text>
  <text x="24" y="412" class="leg">acknowledged, an automated email is sent to the Regulated Party and both sides see the package marked Acknowledged.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="arrowSm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
</svg>
