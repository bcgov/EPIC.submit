apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
    app-group: submit-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        app-group: submit-app
        environment: {{ .Values.env }}
    spec:
      initContainers:
        - name: pre-hook-update-db
          image: image-registry.openshift-image-registry.svc:5000/{{ .Values.imageNamespace }}/{{ .Values.name }}:{{ .Values.imageTag }}
          command: ["/submit-cron/pre-hook-update-db.sh"]
          volumeMounts:
            - name: cron-config
              mountPath: /submit-cron/cron/
              readOnly: true
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: submit-patroni
                  key: app-db-username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: submit-patroni
                  key: app-db-password
            - name: CHES_TOKEN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ches-secrets
                  key: CHES_TOKEN_ENDPOINT
            - name: CHES_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: ches-secrets
                  key: CHES_BASE_URL
            - name: CHES_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ches-secrets
                  key: CHES_CLIENT_ID
            - name: CHES_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ches-secrets
                  key: CHES_CLIENT_SECRET
            - name: WEB_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.name }}-config
                  key: WEB_URL
            - name: DATABASE_NAME
              value: "{{ .Values.database.username }}"
            - name: DATABASE_HOST
              value: "{{ .Values.database.host }}"
            - name: DATABASE_PORT
              value: "{{ .Values.database.port }}"
      containers:
        - name: {{ .Values.name }}
          image: image-registry.openshift-image-registry.svc:5000/{{ .Values.imageNamespace }}/{{ .Values.name }}:{{ .Values.imageTag }}
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: cron-config
              mountPath: /submit-cron/cron/
              readOnly: true
          env: # same as above
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: submit-patroni
                  key: app-db-username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: submit-patroni
                  key: app-db-password
            - name: CHES_TOKEN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ches-secrets
                  key: CHES_TOKEN_ENDPOINT
            - name: CHES_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: ches-secrets
                  key: CHES_BASE_URL
            - name: CHES_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ches-secrets
                  key: CHES_CLIENT_ID
            - name: CHES_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ches-secrets
                  key: CHES_CLIENT_SECRET
            - name: WEB_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.name }}-config
                  key: WEB_URL
            - name: DATABASE_NAME
              value: "{{ .Values.database.username }}"
            - name: DATABASE_HOST
              value: "{{ .Values.database.host }}"
            - name: DATABASE_PORT
              value: "{{ .Values.database.port }}"
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          terminationMessagePath: "/dev/termination-log"
          terminationMessagePolicy: File
          imagePullPolicy: Always
      volumes:
        - name: cron-config
          configMap:
            name: {{ .Values.name }}-config
            defaultMode: 420
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
