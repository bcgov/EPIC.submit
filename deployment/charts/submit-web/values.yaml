app:
  name: submit
  url: https://dev.submit.eao.gov.bc.ca
  api: https://submit-api-c72cba-dev.apps.gold.devops.gov.bc.ca/api
  env: dev
  version: 1.0.0
  title: EPIC.submit
  objectStorageUrl: https://epic-document-api-c8b80a-dev.apps.gold.devops.gov.bc.ca/api
  oidcAuthority: https://dev.loginproxy.gov.bc.ca/auth/realms/eao-epic
  clientId: epic-submit
  conditionsLibraryUrl: https://condition-api-c8b80a-dev.apps.gold.devops.gov.bc.ca/api
  user_guide: /docs/Holder-User-Guide-EPIC.submit-v1.1.pdf
  centreApiUrl: https://centre-api-c8b80a-dev.apps.gold.devops.gov.bc.ca
  geoDocUrl: https://www2.gov.bc.ca/assets/download/C92C40FD8897448F916AB4FE518A4539
  epicSystemEmail: EAO.EPICsystem@gov.bc.ca
  supportMpEmail: EAO.ManagementPlanSupport@gov.bc.ca
  supportIpdEmail: EAO.emailaddress@gov.bc.ca
  # Toggle the pre-launch upgrade/downtime warning banner on the public welcome page.
  showUpgradeBanner: "false"
  # Toggle the post-launch upgrade announcement (informational) banner on the public welcome page.
  showPostUpgradeBanner: "false"
  # Visible User Guide version label (the guide URL itself is set via user_guide).
  userGuideVersion: "2.0"

resources:
  cpu:
    limit: 200m
    request: 200m
  memory:
    limit: 200Mi
    request: 100Mi

image:
  name: submit-web
  tag: dev
  repository: image-registry.openshift-image-registry.svc:5000/c72cba-tools/

keycloak:
  url: "https://dev.loginproxy.gov.bc.ca"
  realm: eao-epic
  client: epic-submit

service:
  port: 8080

replicas:
  count: 1

mountPath: /usr/share/nginx/html/config/
