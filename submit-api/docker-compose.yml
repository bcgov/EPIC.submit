version: "3.9"

services:
  submit-api-db:
    image: postgres
    volumes:
      - db-data:/var/lib/postgresql/data2
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD:admin
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - 54332:5432/tcp
    restart: unless-stopped

  submit-api-db-test:
    image: postgres
    volumes:
      - db-data:/var/lib/postgresql/data3
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD:admin
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - 54333:5432/tcp
    restart: unless-stopped


volumes:
  db-data:
    driver: local
  