name: SUBMIT WEB CI

on:
  pull_request:
    branches: [develop, "release/**"]
    paths: ["submit-web/**", ".github/workflows/*web*.yml"]
  push:
    branches: [develop]
    paths: ["submit-web/**", ".github/workflows/*web*.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    if: github.repository == 'bcgov/EPIC.submit'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submit-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: submit-web/.nvmrc
          cache: npm
          cache-dependency-path: submit-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  ui-contracts:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submit-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: submit-web/.nvmrc
          cache: npm
          cache-dependency-path: submit-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck:ui-contracts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui-contracts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mui-ui-contracts
          path: |
            submit-web/playwright-report/mui-smoke
            submit-web/test-results
