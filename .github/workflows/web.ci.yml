name: SUBMIT WEB CI

on:
  pull_request:
    branches:
      - develop
      - "release**"
    paths:
      - "submit-web/**"
  push:
    branches:
      - develop
      - "release**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev/test/prod)"
        required: true
        default: "dev"

defaults:
  run:
    shell: bash
    working-directory: ./submit-web

jobs:
  setup-job:
    runs-on: ubuntu-22.04

    if: github.repository == 'bcgov/EPIC.submit'

    steps:
      - uses: actions/checkout@v2
      - run: "true"

  linting:
    needs: setup-job
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          npm ci
      - name: Lint
        id: lint
        run: |
          npm run lint

  unit-test:
    needs: setup-job
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          npm ci
      - name: Run unit tests
        id: unit-test
        run: |
          npm run test:unit

  build-check:
    needs: setup-job
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install dependencies
        run: |
          npm ci
      - name: build to check strictness
        id: build
        run: |
          npm run build
