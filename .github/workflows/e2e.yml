name: Isolated E2E pilot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'submit-web/**'
      - 'submit-api/**'
      - 'ci/e2e/**'
      - '.github/workflows/e2e.yml'
permissions:
  contents: read
concurrency:
  group: isolated-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated invitation-to-review journey
        run: ./ci/e2e/run.sh
      - name: Upload browser evidence, email capture and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-e2e-${{ github.run_attempt }}
          path: e2e-artifacts/
          retention-days: 7
