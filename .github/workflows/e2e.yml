name: E2E Tests (Docker Compose)

on:
  workflow_dispatch:  # Manual trigger for now
  # pull_request:      # Uncomment to enable PR triggers
  #   paths:
  #     - 'submit-web/**'
  #     - 'submit-api/**'
  #     - 'docker-compose.e2e.yml'
  #     - '.github/workflows/e2e.yml'

env:
  # Use DEV Keycloak credentials from GitHub secrets
  KEYCLOAK_ADMIN_CLIENT: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_DEV }}
  KEYCLOAK_ADMIN_SECRET: ${{ secrets.KEYCLOAK_ADMIN_SECRET_DEV }}

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Start services via docker compose
      - name: Start services
        run: |
          docker compose -f docker-compose.e2e.yml up -d
          echo "Services starting..."

      # 3. Wait for services to be healthy
      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."

          # Wait for all services to report healthy status
          timeout 120 bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" $(docker compose -f docker-compose.e2e.yml ps -q db))" = "healthy" ]; do echo "Waiting for db..."; sleep 2; done'
          echo "✓ Database is healthy"

          timeout 180 bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" $(docker compose -f docker-compose.e2e.yml ps -q api))" = "healthy" ]; do echo "Waiting for API..."; sleep 2; done'
          echo "✓ API is healthy"

          # Web can take longer due to npm install and Vite startup
          echo "Waiting for web (this may take a few minutes for first build)..."
          timeout 300 bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" $(docker compose -f docker-compose.e2e.yml ps -q web))" = "healthy" ]; do echo "Waiting for Web..."; sleep 5; done'
          echo "✓ Web is healthy"

          echo "All services are ready!"

      # 3.5. Debug CORS configuration
      - name: Debug CORS configuration
        run: |
          echo "=== Checking CORS_ORIGIN in API container ==="
          docker compose -f docker-compose.e2e.yml exec -T api printenv | grep CORS_ORIGIN || echo "CORS_ORIGIN not set!"

          echo ""
          echo "=== API Startup Logs (checking allowedorigins print) ==="
          docker compose -f docker-compose.e2e.yml logs api | tail -50

          echo ""
          echo "=== Testing CORS headers with curl ==="
          curl -H "Origin: http://localhost:5173" \
               -H "Access-Control-Request-Method: POST" \
               -H "Access-Control-Request-Headers: Content-Type" \
               -X OPTIONS \
               http://localhost:3200/api/users/me -v 2>&1 | grep -i "access-control" || echo "No CORS headers found"

      # 4. Wait for migrations to complete
      - name: Wait for migrations
        run: |
          echo "Waiting for database migrations to complete..."
          DB_CONTAINER=$(docker compose -f docker-compose.e2e.yml ps -q db)

          # Wait until the users table exists (created by migrations)
          timeout 60 bash -c 'until docker exec '"$DB_CONTAINER"' psql -U submit -d submit -c "\dt users" 2>&1 | grep -q users; do echo "Waiting for migrations..."; sleep 2; done'
          echo "✓ Migrations completed"

      # 5. Seed test data
      - name: Seed test data
        run: |
          echo "Seeding test data..."
          DB_CONTAINER=$(docker compose -f docker-compose.e2e.yml ps -q db)
          docker exec -i $DB_CONTAINER psql -U submit -d submit < submit-api/scripts/seed_e2e_test_data.sql
          echo "✓ Test data seeded successfully!"

      # 6. Install Playwright dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: submit-web/package-lock.json

      - name: Install dependencies
        working-directory: ./submit-web
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: ./submit-web
        run: npx playwright install --with-deps chromium

      # 7. Run Playwright tests
      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        working-directory: ./submit-web
        env:
          BASE_URL: http://localhost:5173
          STAFF_USERNAME: ${{ secrets.STAFF_USERNAME }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          PROPONENT_USERNAME: ${{ secrets.PROPONENT_USERNAME }}
          PROPONENT_PASSWORD: ${{ secrets.PROPONENT_PASSWORD }}
          PROPONENT_BCSC_USERNAME: ${{ secrets.PROPONENT_BCSC_USERNAME }}
          PROPONENT_BCSC_PASSWORD: ${{ secrets.PROPONENT_BCSC_PASSWORD }}
          PROPONENT_BCEID_USERNAME: ${{ secrets.PROPONENT_BCEID_USERNAME }}
          PROPONENT_BCEID_PASSWORD: ${{ secrets.PROPONENT_BCEID_PASSWORD }}
        run: npx playwright test

      # 8. Upload artifacts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: submit-web/playwright-report
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: submit-web/test-results
          retention-days: 30

      # 9. Cleanup test data
      - name: Cleanup test data
        if: always()
        run: |
          echo "Cleaning up test data..."
          DB_CONTAINER=$(docker compose -f docker-compose.e2e.yml ps -q db)
          docker exec -i $DB_CONTAINER psql -U submit -d submit < submit-api/scripts/cleanup_e2e_test_data.sql
          echo "✓ Test data cleaned up!"

      # 10. Show logs on failure
      - name: Show service logs
        if: failure()
        run: |
          echo "=== API Logs ==="
          docker compose -f docker-compose.e2e.yml logs api

          echo "=== Web Logs ==="
          docker compose -f docker-compose.e2e.yml logs web

          echo "=== Database Logs ==="
          docker compose -f docker-compose.e2e.yml logs db

      # 11. Cleanup
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yml down -v
          echo "Cleanup completed"

      # 12. Fail if tests failed
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
